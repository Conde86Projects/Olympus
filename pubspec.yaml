name: player
description: Player de midia minimalista, multiplataforma (especificacao v0.1).
publish_to: "none"
version: 0.2.1+13

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.1.0
  media_kit_video: ^1.2.0
  media_kit_libs_windows_video: ^1.0.0
  media_kit_libs_linux: ^1.0.0
  file_picker: ^13.1.0
  window_manager: ^0.4.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  media_kit_libs_android_video: ^1.3.8
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
